services:
  - type: web
    name: abr-intelligence-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HEADLESS
        value: "true"
      - key: ABR_API_KEY
        sync: false
      - key: DATABASE_URL_POOLER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ABR_INGEST_URL
        sync: false
      - key: ABR_COLLECTOR_KEY
        sync: false
      - key: ABR_ASTER_FONTE_ID
        sync: false
      - key: ABR_ASTER_ENTIDADE
        value: aster_relatorio
      - key: ASTER_BASE_URL
        value: https://aster.gruposps.com.br/Login/abr
      - key: ASTER_LOGIN_EMAIL
        sync: false
      - key: ASTER_LOGIN_PASSWORD
        sync: false

  - type: web
    name: abr-intelligence-frontend
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_ABR_API_BASE_URL
        sync: false

  - type: cron
    name: abr-local-spreadsheet-inspect
    runtime: docker
    region: oregon
    plan: starter
    schedule: "0 10 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: python tools/trigger_local_spreadsheet_inspect.py
    autoDeployTrigger: commit
    envVars:
      - key: ABR_API_BASE_URL
        sync: false
      - key: ABR_API_KEY
        sync: false
      - key: ABR_LOCAL_SPREADSHEET_DIR
        value: Planilhas
